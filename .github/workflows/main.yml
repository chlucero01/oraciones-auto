name: Publicar Oraciones Automático

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install Pillow gtts requests

      - name: Verificar plan semanal
        run: |
          if [ ! -f plan_semanal.json ]; then
            echo "No hay plan, creando uno..."
            python generar_plan_semanal.py
          fi
          cat plan_semanal.json

      - name: Generar Reel
        run: |
          python generar_reel.py

      - name: Publicar Reel
        run: |
          CAPTION=$(cat caption.txt)
          python publicar_reel.py reel.mp4 "$CAPTION"
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
