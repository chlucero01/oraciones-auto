name: Publicar Oraciones Automático

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests moviepy==1.0.3 gTTS Pillow imageio-ffmpeg
      - env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: |
          HORA=$(date -u +%H)
          if [ "$HORA" = "12" ]; then
            python bot_seguro.py manana
          elif [ "$HORA" = "18" ]; then
            python bot_seguro.py tarde
          else
            echo "Generando Reel de noche..."
            python generar_reel.py
            python publicar_reel.py reel.mp4 "Oración de la Noche 🙏 Buenas noches, que Dios te bendiga. #oracion #noche #fe"
          fi
