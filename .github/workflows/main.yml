name: Publicar Oraciones Automático

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install gTTS Pillow requests pytz

      - name: Verificar plan
        run: |
          if [ ! -f plan_semanal.json ]; then
            python generar_plan_semanal.py
          fi
          cat plan_semanal.json

      - name: Generar Reel
        run: python generar_reel.py

      - name: Publicar Reel
        run: |
          CAPTION=$(cat caption.txt)
          python publicar_reel.py reel.mp4 "$CAPTION"
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
